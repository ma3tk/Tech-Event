# ============================================================
# tech-event 本体 CI (A 案 / タイプ別運用)
#
# 実行内容 (PR の最低保証 = ~5min を目標):
#   - typecheck : pnpm tsc --noEmit
#   - lint      : pnpm lint (eslint v9)
#   - build     : pnpm build (Next.js / Turbopack)
#   - smoke     : Playwright smoke (--grep @smoke, chromium-desktop のみ、~3min)
#
# フル E2E / a11y / VRT / Lighthouse は別 workflow:
#   - .github/workflows/e2e-full.yml
#     trigger: PR (label `e2e:full`) / `[full-e2e]` コミット / push main / nightly cron /
#             workflow_dispatch
#   - .github/workflows/lighthouse.yml (optional, nightly のみ)
#
# 実行環境:
#   - Node.js 22 LTS
#   - Ubuntu latest
#   - pnpm 9 (cache あり)
#
# トリガー:
#   - pull_request: すべての PR
#   - push: main ブランチ
# ============================================================
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# 同 PR で複数回 push されたら古い run はキャンセル
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # 本番ビルド用ダミー値 (実環境では secrets で上書き)
  # PUBLIC_API_KEY: 公開 API の `X-API-Key` 検証で使う。
  # apps/web/.env のローカル値と同じ値を使うことで、E2E (calendar.spec / public-api.spec)
  # でハードコードされた dev key と一致させる。
  PUBLIC_API_KEY: dev-public-api-key-please-change
  NEXT_TELEMETRY_DISABLED: "1"
  CI: "true"
  # Prisma migrate reset 用 (SQLite を使うため file: で十分)。
  # db:reset は cwd=apps/web で実行されるため、apps/web/dev.db に作成される。
  DATABASE_URL: "file:./dev.db"
  # @t3-oss/env-nextjs の Zod 検証は NODE_ENV=production だと必須項目を厳格化する。
  # CI ビルドではこれらは本物ではなく placeholder で十分 (本番は secrets で上書き)。
  AUTH_SECRET: "ci-placeholder-auth-secret-32chars-min-length-ok"
  NEXT_PUBLIC_BASE_URL: "http://localhost:3000"
  # E2E / a11y で `/api/auth/dev-login?nickname=...` 経由のログインを使うために必須。
  # 未設定だと dev-login が 404 を返し、dashboard 等の認証必須ページが空の HTML
  # (lang / title 無し) となり axe が serious 違反 (document-title / html-has-lang) で fail する。
  ENABLE_DEV_LOGIN: "1"
  ENABLE_TEST_ENDPOINTS: "1"
  # 旧形式 te_session を許容 (loginByCookie が生成する署名付き形式と旧形式の両方を受ける)
  LEGACY_SESSION_FALLBACK: "1"
  # Magic Link: 確認ページ→POST の 2 段ではなく、GET で即セッション発行する旧挙動を維持 (E2E 互換)
  MAGIC_LINK_LEGACY_GET: "1"
  # Slack Webhook URL の SSRF 検査で localhost を許容 (slack-webhook E2E が test サーバを叩く)
  SLACK_WEBHOOK_ALLOW_TEST_HOSTS: "1"
  # 抽選自動実行 (GET /api/cron/run-lotteries) のシークレット。
  CRON_SECRET: "ci-cron-secret"

jobs:
  # ------------------------------------------------------------
  # typecheck — tsc --noEmit (Nx run-many)
  # ------------------------------------------------------------
  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Prisma client 生成 (typecheck で必要)。Nx 移行後 schema は apps/web/prisma 配下。
      - run: pnpm exec prisma generate --schema=apps/web/prisma/schema.prisma
      - run: pnpm typecheck

  # ------------------------------------------------------------
  # lint — eslint (Nx run-many)
  # ------------------------------------------------------------
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  # ------------------------------------------------------------
  # build — Next.js production build (Nx)
  # ------------------------------------------------------------
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma generate --schema=apps/web/prisma/schema.prisma
      # SQLite DB を seed しないと build 時の事前 fetch / SSG が落ちるパスがあるため
      # 軽量に reset + seed する。`db:reset` は破壊的だが CI のクリーンな環境なので問題なし。
      - run: pnpm db:reset
      - run: pnpm build

  # ------------------------------------------------------------
  # smoke — Playwright smoke (`@smoke` タグ filter, chromium-desktop only)
  #
  # 目的:
  #   - PR の最低保証として critical path を ~3min で検証する
  #   - 詳細は apps/web-e2e/src/smoke.spec.ts (主要 8 ページ + dev-login + SSE + axe)
  #
  # フル E2E / a11y / VRT はここで実行しない。
  # 起動条件: PR label `e2e:full` / `[full-e2e]` コミット / push main / nightly cron。
  # → .github/workflows/e2e-full.yml
  # ------------------------------------------------------------
  smoke:
    name: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma generate --schema=apps/web/prisma/schema.prisma
      - run: pnpm db:reset

      # `prisma migrate reset --force` は prisma.config.ts の seed コマンドを起動するが、
      # CI 環境では稀に seed が走らないケースがあるため、明示的に seed.ts を再実行する
      # (冪等: seed.ts は既存ユーザーがあれば upsert する)。
      - name: Seed fixture data (apps/web cwd)
        working-directory: apps/web
        run: |
          pnpm exec tsx prisma/seed.ts || true
          pnpm exec tsx prisma/seed-test-user.ts
          pnpm exec tsx scripts/init-fts.ts || true
          pnpm exec tsx scripts/recalc-counters.ts || true

      # 個別 spec が process.cwd()/dev.db を参照するため、apps/web-e2e/dev.db に
      # apps/web/dev.db のリンクを張る (シンボリックリンクで参照のみ)。
      - name: Link dev.db into apps/web-e2e (process.cwd 参照のため)
        run: ln -sf "$GITHUB_WORKSPACE/apps/web/dev.db" "$GITHUB_WORKSPACE/apps/web-e2e/dev.db"

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      # smoke 抽出: --grep @smoke で smoke.spec.ts 内の `@smoke` タグ test のみ実行
      # workers は smoke.spec.ts の test 数 (~21) を考慮し 4 並列のまま。
      # `@sb-rendering` は Storybook を要するため別 job (storybook-rendering) に隔離。
      - name: Run Playwright smoke (--grep @smoke, exclude @sb-rendering)
        working-directory: apps/web-e2e
        run: |
          pnpm exec playwright test \
            --config="$GITHUB_WORKSPACE/apps/web-e2e/playwright.config.ts" \
            --project=chromium-desktop \
            --grep @smoke \
            --grep-invert @sb-rendering

      - name: Upload Playwright smoke report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-smoke-report
          path: apps/web-e2e/playwright-report
          retention-days: 14

  # ------------------------------------------------------------
  # storybook-rendering — Storybook docs / story の runtime rendering 検証
  #
  # 目的:
  #   - storybook-static の build が成功していても、`No Preview` や React rendering error が
  #     iframe.html に出るケースを検出する (build/index.json だけでは検出不可)
  #   - 詳細は apps/web-e2e/src/storybook-rendering.spec.ts (主要 9 docs + 4 stories)
  #
  # 構成:
  #   1) pnpm nx run web:build-storybook で apps/web/storybook-static を生成
  #   2) python3 -m http.server 6006 で apps/web/storybook-static を serve
  #   3) STORYBOOK_BASE_URL=http://localhost:6006 で Playwright spec (`--grep @sb-rendering`)
  # ------------------------------------------------------------
  storybook-rendering:
    name: storybook-rendering
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma generate --schema=apps/web/prisma/schema.prisma

      - name: Build Storybook (static)
        run: pnpm nx run web:build-storybook

      - name: Serve storybook-static on :6006
        run: |
          (cd apps/web/storybook-static && python3 -m http.server 6006 > /tmp/sb-serve.log 2>&1 &)
          # 6006 に index.json が到達できるまで wait (最大 30s)
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:6006/index.json > /dev/null; then
              echo "Storybook ready on :6006"; exit 0;
            fi
            sleep 1
          done
          echo "Storybook did not become ready"; cat /tmp/sb-serve.log; exit 1

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Storybook rendering spec (--grep @sb-rendering)
        working-directory: apps/web-e2e
        env:
          STORYBOOK_BASE_URL: http://localhost:6006
          # 本 job では Next.js dev server / dev.db スナップショットは不要なため skip
          E2E_SKIP_SERVER: "1"
          SKIP_DB_SNAPSHOT: "1"
        run: |
          pnpm exec playwright test \
            --config="$GITHUB_WORKSPACE/apps/web-e2e/playwright.config.ts" \
            --project=chromium-desktop \
            --grep @sb-rendering

      - name: Upload Playwright storybook-rendering report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-storybook-rendering-report
          path: apps/web-e2e/playwright-report
          retention-days: 14
