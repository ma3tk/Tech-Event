# docker-compose for tech-event 本番想定スタック
#
# 目的:
#   - PostgreSQL 16 本体の起動 (Prisma で PG schema を使う際の接続先)
#   - Mailpit (SMTP 受信) で Magic Link / 通知メールの送信デバッグ
#   - MinIO (S3 互換) でカバー画像アップロードの開発時相手
#
# 起動方法:
#   docker compose up -d                 # 全サービス
#   docker compose up postgres            # PG だけ
#   docker compose down -v                # ボリュームごと削除
#
# 接続情報 (.env.production などで使う想定):
#   DATABASE_URL="postgresql://techevent:techevent@localhost:5432/techevent?schema=public"
#   SMTP_URL="smtp://mailpit:1025"
#   S3_ENDPOINT="http://localhost:9000" / S3_REGION="us-east-1"
#   S3_ACCESS_KEY="minioadmin" / S3_SECRET_KEY="minioadmin"
#
# 注: SQLite 版 (`DATABASE_URL="file:./dev.db"`) で開発するなら docker compose 不要。
# このスタックは PG/メール/S3 を一括で立てたい本番動作確認向け。

services:
  postgres:
    image: postgres:16-alpine
    container_name: tech-event-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: techevent
      POSTGRES_PASSWORD: techevent
      POSTGRES_DB: techevent
      # Asia/Tokyo に揃えて event datetime の表示崩れ回避
      TZ: Asia/Tokyo
      PGTZ: Asia/Tokyo
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U techevent -d techevent"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Mailpit: SMTP 受信 + Web UI (http://localhost:8025)
  # Magic Link / 通知メールの送信先として使用。
  mailpit:
    image: axllent/mailpit:latest
    container_name: tech-event-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI
    environment:
      MP_MAX_MESSAGES: "5000"
      MP_DATA_FILE: "/data/mailpit.db"
    volumes:
      - mailpit-data:/data

  # MinIO: S3 互換ストレージ + Web UI (http://localhost:9001)
  # イベント/グループのカバー画像アップロード先。
  minio:
    image: minio/minio:latest
    container_name: tech-event-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000" # API
      - "9001:9001" # Web UI
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 初回起動時に tech-event bucket を作成するワンショット init コンテナ
  minio-init:
    image: minio/mc:latest
    container_name: tech-event-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/tech-event &&
      mc anonymous set download local/tech-event &&
      echo 'tech-event bucket ready'
      "

  # Redis: BullMQ (apps/worker) のキュー / job 状態 / pub-sub のバックエンド。
  # 接続先 env: REDIS_URL="redis://localhost:6379"
  redis:
    image: redis:7-alpine
    container_name: tech-event-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # BullMQ worker: participation / notification / lottery キューを subscribe。
  # apps/worker/Dockerfile からビルドし、Next.js とは独立に動く。
  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    container_name: tech-event-worker
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      REDIS_URL: "redis://redis:6379"
      DATABASE_URL: "postgresql://techevent:techevent@postgres:5432/techevent?sslmode=disable"
      WORKER_CONCURRENCY: "5"
      LOG_LEVEL: "info"

volumes:
  postgres-data:
  mailpit-data:
  minio-data:
  redis-data:
